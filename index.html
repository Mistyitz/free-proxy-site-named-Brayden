<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display SVG</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .svg-container {
            max-width: 80%;
            max-height: 80%;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="svg-container">
        <!-- Method 1: Using an img tag (Recommended) -->
        <img src="https://cdn.jsdelivr.net/gh/Mr-Calvin-Math-Class/discrete-chaos-3164@main/INVADDEX.SVG" alt="INVADDEX SVG">
    </div>

</body>
</html>
